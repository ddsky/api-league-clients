  /compute-nutrition:
    get:
      deprecated: false
      description: "Compute detailed nutritional information for a given recipe (list\
        \ of ingredients). The API will return the nutritional information for each\
        \ ingredient, as well as the total nutritional content for the entire recipe.\
        \ Aside from macro and micro nutrients, the API also returns flavanoid information\
        \ and food properties such as glycemic index, glycemic load, and inflammation\
        \ score."
      externalDocs:
        description: Read entire docs
        url: https://apileague.com/apis/compute-nutrition-api/
      operationId: computeNutritionAPI
      parameters:
      - description: A comma-separated list of the ingredients of the recipe.
        explode: false
        in: query
        name: ingredients
        required: true
        schema:
          example: "1 cup apples,3oz milk,35g butter"
          maxLength: 1000
          pattern: "."
          type: string
        style: form
      - description: The number of servings the ingredients make. Nutrition is computed
          per serving.
        explode: false
        in: query
        name: servings
        required: false
        schema:
          example: 1
          format: int32
          maximum: 999
          minimum: 1
          type: integer
        style: form
      - description: "If there is oil in the ingredients, e.g. 3 tablespoons olive\
          \ oil but they are used for frying, not all of the oil is consumed and therefore\
          \ should not be added to the computed nutrition. In this case set reduce-oils\
          \ to true."
        explode: false
        in: query
        name: reduce-oils
        required: false
        schema:
          example: true
          type: boolean
        style: form
