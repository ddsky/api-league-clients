  /search-recipes:
    get:
      deprecated: false
      description: "Search and filter thousands of recipes with natural language,\
        \ e.g. pasta recipes without mushrooms but with truffles. You can filter by\
        \ ingredients, diet, cuisine, meal type, macro and micro nutrition, intolerances,\
        \ and much more."
      externalDocs:
        description: Read entire docs
        url: https://apileague.com/apis/search-recipes-api/
      operationId: searchRecipesAPI
      parameters:
      - description: The search query.
        explode: false
        in: query
        name: query
        required: false
        schema:
          example: pasta with mushrooms but without nuts
          maxLength: 300
          pattern: "."
          type: string
        style: form
      - description: "The cuisine(s) of the recipes. One or more, comma-separated\
          \ (will be interpreted as 'OR')."
        explode: false
        in: query
        name: cuisines
        required: false
        schema:
          example: mexican
          maxLength: 300
          pattern: "."
          type: string
        style: form
      - description: "The cuisine(s) the recipes must not match. One or more, comma-separated\
          \ (will be interpreted as 'AND')."
        explode: false
        in: query
        name: exclude-cuisines
        required: false
        schema:
          example: "indian,japanese"
          maxLength: 300
          pattern: "."
          type: string
        style: form
